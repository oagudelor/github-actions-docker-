# ═══════════════════════════════════════════════════════════════
# .github/workflows/docker-deploy.yml
#
# Propósito : Pipeline CI/CD completo para el demo del video.
#             Se ejecuta automáticamente con cada push a main.
#
# Pasos     :
#   1. Descarga el código del repositorio
#   2. Inicia sesión en Docker Hub (con secretos)
#   3. Compila la imagen Docker
#   4. Sube la imagen a Docker Hub con dos etiquetas:
#        - :latest  (siempre actualizada)
#        - :<sha>   (trazabilidad por commit)
# ═══════════════════════════════════════════════════════════════

name: 🐳 Build & Push Docker Image

# ── Disparador ─────────────────────────────────────────────
on:
  push:
    branches:
      - main          # Solo se activa en la rama principal

# ── Variables de entorno globales ──────────────────────────
env:
  IMAGE_NAME: ${{ secrets.DOCKER_HUB_USERNAME }}/github-actions-docker-demo

# ── Trabajos ────────────────────────────────────────────────
jobs:

  build-and-push:
    name: Build & Push to Docker Hub
    runs-on: ubuntu-latest   # Runner gratuito de GitHub

    steps:

      # 1 ── Descargar el código del repositorio
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v4

      # 2 ── Iniciar sesión en Docker Hub usando secretos
      #      (nunca escribas credenciales directamente aquí)
      - name: 🔐 Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # 3 ── Compilar la imagen a partir del Dockerfile
      - name: 🔨 Compilar imagen Docker
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:latest \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            .

      # 4 ── Subir ambas etiquetas a Docker Hub
      - name: 🚀 Subir imagen a Docker Hub
        run: |
          docker push ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}

      # 5 ── Resumen en el log de Actions (opcional pero útil)
      - name: ✅ Resumen del deploy
        run: |
          echo "### 🐳 Imagen publicada exitosamente" >> $GITHUB_STEP_SUMMARY
          echo "- **Imagen:** \`${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tags:** \`latest\`, \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
